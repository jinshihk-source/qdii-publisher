<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QDII 发布工作台 (小红书优化版)</title>
<style>
/* 核心工作台 UI（保持基本功能，调整配色使其更现代） */
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#059669;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1320px;margin:auto;padding:26px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:25px;font-weight:800}
.sub{color:var(--muted)}
button{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--ink);color:white}
.ghost{background:white;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.metric{font-size:28px;font-weight:800;margin-top:8px}
.ok{color:var(--green)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.panel h2{margin:0 0 14px;font-size:17px}
.indexnav{display:flex;gap:10px;margin-bottom:16px;padding:6px;background:#eef1f5;border-radius:14px;width:max-content}
.indexnav button{font-size:16px;padding:11px 22px;background:transparent}
.indexnav button.active{background:#fff;color:#111827;box-shadow:0 1px 4px #0001}
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{background:transparent;color:var(--muted)}
.tabs button.active{background:#111827;color:#fff}
.sectiontitle{font-size:22px;font-weight:800;margin:4px 0 14px}
.countpill{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:12px}
.chg-up{color:var(--green);font-weight:700}
.chg-down{color:var(--red);font-weight:700}
.publish{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pub{border:1px solid var(--line);border-radius:14px;padding:16px}
.pub b{display:block;font-size:16px;margin-bottom:6px}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
.err{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:8px}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid,.publish{grid-template-columns:1fr}.wrap{padding:14px}}

/* --- 小红书金融信息海报 --- */
.xhs-dialog{padding:0;border:0;border-radius:18px;background:#f4f7fb;max-width:96vw;max-height:96vh}.xhs-dialog::backdrop{background:#0b1730cc}.xhs-dialog-content{display:flex;flex-direction:column;max-height:96vh}.xhs-toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#fff;border-bottom:1px solid #dbe4f0}.xhs-scroll-area{overflow:auto;padding:28px;background:#eaf0f8;display:flex;justify-content:center}
.xhs-poster{width:1080px;height:1440px;background:linear-gradient(180deg,#eaf6ff 0,#f8fbff 23%,#f5f7fb 100%);position:relative;overflow:hidden;padding:42px 38px 32px;color:#10264d;transform:scale(.6);transform-origin:top center;margin-bottom:-576px}
.xhs-poster:before{content:"";position:absolute;left:0;right:0;top:0;height:230px;background:radial-gradient(circle at 78% 20%,#ffffffcc 0 9%,transparent 35%),linear-gradient(120deg,#d7efff,#e8e2ff);z-index:0}.xhs-glass-card{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}.xhs-title-box{padding:6px 10px 24px}.xhs-kicker{font-size:20px;font-weight:800;color:#2f6edb;letter-spacing:2px}.xhs-title{font-size:55px;line-height:1.08;font-weight:900;margin:8px 0;color:#0d2a55}.xhs-subtitle{font-size:22px;color:#526985;margin:0}.xhs-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}.xhs-metric{background:#ffffffdd;border:1px solid #dce8f5;border-radius:16px;padding:13px 16px}.xhs-metric b{display:block;font-size:26px;color:#1665d8;margin-top:4px}.xhs-metric span{font-size:15px;color:#6c7d93}
.xhs-section{border-radius:18px 18px 0 0;padding:13px 20px;color:#fff;font-size:25px;font-weight:850;background:linear-gradient(90deg,#1269e8,#39a7ef)}.xhs-section.otc{background:linear-gradient(90deg,#6542df,#9c63e8)}.xhs-list{background:#fff;border:1px solid #dbe6f2;border-top:0;border-radius:0 0 18px 18px;overflow:hidden;flex:1}.xhs-table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}.xhs-table th{background:#edf5ff;color:#304967;font-size:15px;font-weight:800;padding:9px 5px;border-bottom:1px solid #d5e1ee;text-align:center;white-space:normal}.xhs-table td{font-size:15px;font-weight:650;padding:7px 5px;border-bottom:1px solid #e4ebf3;text-align:right;vertical-align:middle;white-space:nowrap}.xhs-table tbody tr:nth-child(even){background:#f9fbfe}.xhs-table .fund{text-align:left;white-space:normal;padding-left:12px;font-weight:800;color:#173052}.xhs-table .fund small{display:block;color:#8290a3;font-size:13px;font-weight:600;margin-top:2px}.xhs-red{color:#e43c45!important}.xhs-green{color:#139365!important}.xhs-amber{color:#d36a24!important}.xhs-muted{color:#8794a5!important}.xhs-footer{font-size:15px;color:#718197;padding:14px 4px 0;display:flex;justify-content:space-between;gap:16px}.xhs-footer span:last-child{text-align:right}
.xhs-title-box{position:relative;min-height:205px;padding-right:230px}.xhs-title-box:after{content:"QDII";position:absolute;right:10px;top:22px;font-size:72px;font-weight:950;color:#1671e81c;letter-spacing:-4px}.xhs-title{font-size:58px!important;text-align:left!important;letter-spacing:0!important}.xhs-subtitle{text-align:left!important;background:#ffffffa8;display:inline-block;padding:7px 15px;border-radius:18px}.xhs-summary{background:#fff;border-radius:20px;padding:10px;box-shadow:0 5px 20px #4671a512}.xhs-table th,.xhs-table td{border-right:1px solid #e1e9f3}.xhs-table td:first-child{text-align:center}.xhs-footer{background:#ffffffc7;border-radius:14px;padding:11px 14px;margin-top:12px}</style>
<link rel="stylesheet" href="assets/publisher.css">
<!-- 引入 html2canvas 用于一键导出小红书图片 -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div>
            <div class="brand">QDII DAILY · 发布工作台</div>
            <div class="sub" id="stamp">正在读取数据…</div>
        </div>
        <div>
            <button class="ghost" onclick="location.reload()">刷新数据</button>
        </div>
    </div>
    
    <div class="cards">
        <div class="card"><div class="sub">场外基金</div><div class="metric" id="otcN">—</div></div>
        <div class="card"><div class="sub">场内 ETF</div><div class="metric" id="etfN">—</div></div>
        <div class="card"><div class="sub">待核验</div><div class="metric" id="errN">—</div></div>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="indexnav">
                <button id="idxNasdaq" class="active" onclick="selectIndex('nasdaq100',this)">纳斯达克100</button>
                <button id="idxSp" onclick="selectIndex('sp500',this)">标普500</button>
            </div>
            
            <div class="sectionbar" style="display:flex; justify-content:space-between; align-items:center;">
                <div class="sectiontitle" id="sectionTitle">纳斯达克100</div>
                <button class="primary" onclick="generateXhsPoster()">生成当前发布图</button>
            </div>
            
            <div class="tabs">
                <button id="tabOtc" class="active" onclick="selectType('otc',this)">场外基金 <span class="countpill" id="otcIndexN"></span></button>
                <button id="tabEtf" onclick="selectType('etf',this)">场内 ETF <span class="countpill" id="etfIndexN"></span></button>
            </div>
            
            <div style="overflow:auto">
                <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
            </div>
        </div>
        
        <div>
            <div class="panel">
                <h2>数据健康</h2>
                <div id="errors"></div>
            </div>
            <div class="panel" style="margin-top:16px">
                <h2>关于小红书图表</h2>
                <p class="sub">发布图与当前网页字段保持一致；15只以内一张图，超过15只自动分页。场外完整展示代销、直销、较昨日、年费率和近1年；场内完整展示价格、涨跌、T-1溢价、成交额、年费率和近1年。</p>
            </div>
        </div>
    </div>
</div>

<!-- 小红书海报预览弹窗 -->
<dialog id="xhsDialog" class="xhs-dialog">
    <div class="xhs-dialog-content">
        <div class="xhs-toolbar">
            <h2>小红书发布图预览</h2>
            <div>
                <button class="primary" onclick="downloadPoster()">下载当前图片</button><button class="primary" onclick="downloadAllPosters()" style="margin-left:8px;background:#6542df">下载全部图片</button>
                <button class="ghost" onclick="document.getElementById('xhsDialog').close()" style="margin-left:10px;">关闭</button>
            </div>
        </div>
        <div class="xhs-scroll-area">
            <!-- 真实海报渲染区 -->
            <div id="posterArea" class="xhs-poster">
 <div class="xhs-glass-card">
  <div class="xhs-title-box"><div class="xhs-kicker">QDII DAILY · 每日数据观察</div><h1 class="xhs-title" id="posterTitle">QDII 数据一览</h1><p class="xhs-subtitle" id="posterSubTitle">更新时间：—</p></div>
  <div class="xhs-summary" id="posterSummary"></div>
  <div class="xhs-section" id="posterSection">场外基金</div>
  <div class="xhs-list" id="posterList"></div>
  <div class="xhs-footer"><span>数据：公开基金资料 / 东方财富 / 天天基金 / qdiilimit</span><span>T-1溢价为上一交易日数据 · 不构成投资建议</span></div>
 </div>
</div></div>
        </div>
    </div>
</dialog>

<script>
let D={otc:[],etf:[],errors:[]},currentIndex='nasdaq100',currentType='otc';
const $=id=>document.getElementById(id),fmt=v=>v==null||v===''?'—':v,money=v=>v==null?'—':(typeof v==='number'?'¥'+v:fmt(v));

// 基础数据加载与渲染
async function boot(){
    try{D=await(await fetch('data/latest.json?'+Date.now())).json()}
    catch(e){D.errors=['无法读取最新数据。']}
    render()
}

function normIndex(x){return String(x||'').toLowerCase().includes('sp')?'sp500':'nasdaq100'}

function render(){
    $('stamp').textContent=`数据日期 ${D.date||'—'} · 更新 ${D.updated_at||'—'}`;
    $('otcN').textContent=D.otc.length;
    $('etfN').textContent=D.etf.length;
    $('errN').textContent=(D.errors||[]).length;
    
    $('errors').innerHTML=(D.errors||[]).length?D.errors.map(x=>`<div class=err>⚠ ${typeof x==='string'?x:[x.code,x.source,x.error].filter(Boolean).join(' · ')}</div>`).join(''):'<div class="ok">● 当前无采集错误</div>';
    
    updateIndexView()
}

function selectIndex(k,btn){
    currentIndex=k;
    document.querySelectorAll('.indexnav button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    updateIndexView()
}

function selectType(t,btn){
    currentType=t;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    updateIndexView()
}

function updateIndexView(){
    $('sectionTitle').textContent=currentIndex==='nasdaq100'?'纳斯达克100':'标普500';
    $('otcIndexN').textContent=D.otc.filter(x=>normIndex(x.index)===currentIndex).length+'只';
    $('etfIndexN').textContent=D.etf.filter(x=>normIndex(x.index)===currentIndex).length+'只';
    show(currentType,currentIndex)
}

function changeText(v){return v==='up'?'↑ 放宽':v==='down'?'↓ 收紧':v==='new'?'新增':v==='changed'?'有变化':'—'}
function fundSort(rows){let totals={};rows.forEach(x=>{let c=x.fund_company||'';totals[c]=(totals[c]||0)+(typeof x.agency_limit==='number'?x.agency_limit:0)+(typeof x.direct_limit==='number'?x.direct_limit:0)});return rows.slice().sort((a,b)=>(b.company_total_quota??totals[b.fund_company||'']??0)-(a.company_total_quota??totals[a.fund_company||'']??0))}
function show(type,indexKey){
 if(type==='otc'){
  $('thead').innerHTML='<tr><th>基金</th><th>代码</th><th>代销</th><th>直销</th><th>较昨日</th><th>年费率</th><th>近1年</th></tr>';
  let rows=fundSort(D.otc.filter(x=>normIndex(x.index)===indexKey));
  $('tbody').innerHTML=rows.map(x=>`<tr><td>${x.name}</td><td>${x.code}</td><td>${money(x.agency_limit)}</td><td>${money(x.direct_limit)}</td><td>${changeText(x.change)}</td><td>${x.fee_annual==null?'—':Number(x.fee_annual).toFixed(2)+'%'}</td><td>${x.return_1y==null?'—':(x.return_1y>=0?'+':'')+Number(x.return_1y).toFixed(2)+'%'}</td></tr>`).join('')
 }else{
  $('thead').innerHTML='<tr><th>ETF</th><th>代码</th><th>价格</th><th>涨跌幅</th><th>T-1溢价率</th><th>成交额</th><th>年费率</th><th>近1年</th></tr>';
  let rows=D.etf.filter(x=>normIndex(x.index)===indexKey);
  $('tbody').innerHTML=rows.map(x=>`<tr><td>${x.name}</td><td>${x.code}</td><td>${x.price==null?'—':Number(x.price).toFixed(3)}</td><td>${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+Number(x.change_pct).toFixed(2)+'%'}</td><td>${x.premium_pct==null?'—':Number(x.premium_pct).toFixed(2)+'%'}</td><td>${x.amount==null?'—':(x.amount/1e8).toFixed(2)+'亿'}</td><td>${x.fee_annual==null?'—':Number(x.fee_annual).toFixed(2)+'%'}</td><td>${x.return_1y==null?'—':(x.return_1y>=0?'+':'')+Number(x.return_1y).toFixed(2)+'%'}</td></tr>`).join('')
 }}
// ==== 核心：小红书图表生成逻辑 (最多15个) ====
let posterPages=[],posterPage=0;
function pct(v){return v==null?'—':(Number(v)>=0?'+':'')+Number(v).toFixed(2)+'%'}
function posterMoney(v){if(v==null)return '—';if(typeof v!=='number')return String(v);return v>=10000?'¥'+(v/10000).toFixed(v%10000?1:0)+'万':'¥'+v.toLocaleString('zh-CN')}
function generateXhsPoster(){
 let rows=D[currentType].filter(x=>normIndex(x.index)===currentIndex);if(currentType==='otc')rows=fundSort(rows);
 posterPages=[];for(let i=0;i<rows.length;i+=15)posterPages.push(rows.slice(i,i+15));posterPage=0;
 if(!posterPages.length)posterPages=[[]];renderPosterPage(0);$('xhsDialog').showModal();
}
function renderPosterPage(page){
 posterPage=page;const rows=posterPages[page]||[],indexName=currentIndex==='nasdaq100'?'纳斯达克100':'标普500',typeName=currentType==='etf'?'场内 ETF':'场外基金',total=D[currentType].filter(x=>normIndex(x.index)===currentIndex).length;
 $('posterTitle').innerHTML=indexName+'<br><span style="color:#1671e8">QDII '+typeName+' 一览</span>';
 $('posterSubTitle').innerText='一图看懂 · '+(currentType==='etf'?'价格 · 涨跌 · 溢价 · 成交额 · 年费率 · 近1年':'代销限额 · 直销限额 · 较昨日 · 年费率 · 近1年')+'　｜　数据日期 '+(D.date||'—');
 $('posterSection').className='xhs-section'+(currentType==='otc'?' otc':'');$('posterSection').innerText=typeName+'（共 '+total+' 只） · '+(page+1)+' / '+posterPages.length;
 if(currentType==='etf'){
  const ps=rows.map(x=>Number(x.premium_pct)).filter(Number.isFinite),rs=rows.map(x=>Number(x.return_1y)).filter(Number.isFinite),avg=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null,hi=ps.length?Math.max(...ps):null,best=rs.length?Math.max(...rs):null;
  $('posterSummary').innerHTML=`<div class="xhs-metric"><span>ETF数量（场内）</span><b>${total}只</b></div><div class="xhs-metric"><span>本页平均 T-1 溢价</span><b class="xhs-red">${avg==null?'—':avg.toFixed(2)+'%'}</b></div><div class="xhs-metric"><span>本页最高 T-1 溢价</span><b class="xhs-red">${hi==null?'—':hi.toFixed(2)+'%'}</b></div><div class="xhs-metric"><span>本页近1年最高</span><b class="xhs-red">${best==null?'—':pct(best)}</b></div>`;
  $('posterList').innerHTML=`<table class="xhs-table"><colgroup><col style="width:4%"><col style="width:27%"><col style="width:10%"><col style="width:11%"><col style="width:12%"><col style="width:12%"><col style="width:10%"><col style="width:14%"></colgroup><thead><tr><th>序号</th><th>ETF名称（代码）</th><th>最新价</th><th>涨跌幅</th><th>T-1溢价</th><th>成交额</th><th>年费率</th><th>近1年收益</th></tr></thead><tbody>`+rows.map((x,i)=>`<tr><td>${page*15+i+1}</td><td class="fund">${x.name}<small>${x.code}</small></td><td>${x.price==null?'—':Number(x.price).toFixed(3)}</td><td class="${Number(x.change_pct)>=0?'xhs-red':'xhs-green'}">${pct(x.change_pct)}</td><td class="${Number(x.premium_pct)>8?'xhs-amber':''}">${x.premium_pct==null?'—':Number(x.premium_pct).toFixed(2)+'%'}</td><td>${x.amount==null?'—':(x.amount/1e8).toFixed(1)+'亿'}</td><td>${x.fee_annual==null?'—':Number(x.fee_annual).toFixed(2)+'%'}</td><td class="${Number(x.return_1y)>=0?'xhs-red':'xhs-green'}">${pct(x.return_1y)}</td></tr>`).join('')+'</tbody></table>';
 }else{
  const all=D.otc.filter(x=>normIndex(x.index)===currentIndex),ag=all.filter(x=>typeof x.agency_limit==='number'&&x.agency_limit>0).length,dr=all.filter(x=>typeof x.direct_limit==='number'&&x.direct_limit>0).length,changed=all.filter(x=>x.change&&x.change!=='same').length;
  $('posterSummary').innerHTML=`<div class="xhs-metric"><span>场外基金</span><b>${total}只</b></div><div class="xhs-metric"><span>代销有额度</span><b>${ag}只</b></div><div class="xhs-metric"><span>直销有额度</span><b>${dr}只</b></div><div class="xhs-metric"><span>较昨日有变化</span><b>${changed}只</b></div>`;
  $('posterList').innerHTML=`<table class="xhs-table"><colgroup><col style="width:5%"><col style="width:34%"><col style="width:14%"><col style="width:14%"><col style="width:12%"><col style="width:10%"><col style="width:11%"></colgroup><thead><tr><th>序号</th><th>基金名称（代码）</th><th>代销额度</th><th>直销额度</th><th>较昨日</th><th>年费率</th><th>近1年</th></tr></thead><tbody>`+rows.map((x,i)=>`<tr><td>${page*15+i+1}</td><td class="fund">${x.name}<small>${x.code}</small></td><td>${posterMoney(x.agency_limit)}</td><td>${posterMoney(x.direct_limit)}</td><td>${changeText(x.change)}</td><td>${x.fee_annual==null?'—':Number(x.fee_annual).toFixed(2)+'%'}</td><td class="${Number(x.return_1y)>=0?'xhs-red':'xhs-green'}">${pct(x.return_1y)}</td></tr>`).join('')+'</tbody></table>';
 }
 let nav=document.getElementById('posterNav');if(!nav){nav=document.createElement('div');nav.id='posterNav';nav.style.cssText='text-align:center;margin-top:10px;font-size:16px;color:#526985';$('posterList').after(nav)}
 nav.innerHTML=posterPages.length>1?`<button class="ghost" onclick="renderPosterPage(Math.max(0,posterPage-1))">上一张</button>　<strong>${page+1} / ${posterPages.length}</strong>　<button class="ghost" onclick="renderPosterPage(Math.min(posterPages.length-1,posterPage+1))">下一张</button>`:'1 / 1';
}
// ==== 下载高清海报 ====
async function posterCanvas(){const poster=$('posterArea'),oldT=poster.style.transform,oldM=poster.style.marginBottom;poster.style.transform='scale(1)';poster.style.marginBottom='0';await new Promise(r=>setTimeout(r,50));const canvas=await html2canvas(poster,{scale:2,useCORS:true,backgroundColor:null});poster.style.transform=oldT;poster.style.marginBottom=oldM;return canvas}
async function downloadPoster(){const canvas=await posterCanvas(),a=document.createElement('a');a.download=`QDII_${currentIndex}_${currentType}_${posterPage+1}of${posterPages.length}.png`;a.href=canvas.toDataURL('image/png');a.click()}
async function downloadAllPosters(){const keep=posterPage;for(let i=0;i<posterPages.length;i++){renderPosterPage(i);await new Promise(r=>setTimeout(r,80));await downloadPoster();await new Promise(r=>setTimeout(r,250))}renderPosterPage(keep)}

boot();
</script>
</body>
</html>
