name: Update QDII Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * 0-4'
    - cron: '5 4 * * 1-5'
    - cron: '10 7 * * 1-5'
    - cron: '35 12 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - name: Commit data snapshots
        run: |
          git config user.name "qdii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%F-%H%M)"
          git push
