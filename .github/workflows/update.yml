name: Update QDII Publisher
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update.py'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '30 23 * * 0-4'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - name: Commit data snapshots
        run: |
          git config user.name "qdii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
